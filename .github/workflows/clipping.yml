name: Clipping

on:
  schedule:
    - cron: "17 9 * * *"      # todo dia, 06h17 em Marabá (09h17 UTC)
  workflow_dispatch:           # botão "Run workflow" para rodar na hora
    inputs:
      inicio:
        description: "Data inicial (AAAA-MM-DD). Deixe vazio para só os últimos 7 dias."
        required: false
      fim:
        description: "Data final (AAAA-MM-DD). Vazio = hoje."
        required: false
      fontes:
        description: "Fontes, separadas por vírgula: google, bing, gdelt, locais, sites, feeds, sitemaps, alertas. Vazio = todas."
        required: false
      reverificar:
        description: "Marque (true) para reler o texto das matérias já salvas e descartar as que não citam a Unifesspa. Não coleta nada novo."
        required: false
        default: "false"

permissions:
  contents: write

concurrency:          # evita duas coletas ao mesmo tempo mexendo no mesmo arquivo
  group: clipping
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar
        run: python teste_coletar.py
      - name: Coletar
        run: |
          FONTES=""
          if [ -n "${{ github.event.inputs.fontes }}" ]; then
            FONTES="--fontes ${{ github.event.inputs.fontes }}"
          fi
          if [ "${{ github.event.inputs.reverificar }}" = "true" ]; then
            python coletar.py --reverificar
          elif [ -n "${{ github.event.inputs.inicio }}" ]; then
            python coletar.py --inicio "${{ github.event.inputs.inicio }}" ${{ github.event.inputs.fim && format('--fim "{0}"', github.event.inputs.fim) || '' }} $FONTES
          else
            python coletar.py --dias 7 $FONTES
          fi
      - name: Salvar resultados
        run: |
          git config user.name "clipping-ascom"
          git config user.email "actions@users.noreply.github.com"
          git add dados
          git diff --cached --quiet || git commit -m "Atualiza clipping"
          git push
