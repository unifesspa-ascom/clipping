<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipping ASCOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#eef0ef; --surface:#fff; --fg:#17251d; --muted:#586a5e; --line:#d7dcd8;
  --accent:#1d4ed8; --accent-ink:#163fb0; --accent-bg:#eaf0fd;
  --pos:#15803d; --pos-bg:#e3f4e8; --neu:#64748b; --neu-bg:#e9edf1; --neg:#c62828; --neg-bg:#fbe6e6; --pen:#a16207; --pen-bg:#fdf3d6;
  --shadow:0 14px 36px -26px rgba(4,32,16,.45); --font:'Montserrat',Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10140f; --surface:#1a211a; --fg:#e9efea; --muted:#9db0a2; --line:#2c352c;
  --accent:#5b8bf0; --accent-ink:#8bb0f5; --accent-bg:#1b2436;
  --pos:#5fd486; --pos-bg:#16301f; --neu:#a3b1c2; --neu-bg:#242c35; --neg:#ff8a8a; --neg-bg:#3a1c1c; --pen:#f0c456; --pen-bg:#352d14;
  --shadow:0 14px 36px -26px rgba(0,0,0,.8);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 0}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:44px;width:auto;display:block}
.brand h1{margin:0;font-size:18px;font-weight:800;line-height:1.2}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:700 13px var(--font);border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
.tabs{display:flex;gap:4px;margin-top:2px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:700 13.5px var(--font);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
main{padding:20px 0 56px}
.notice{background:var(--pen-bg);color:var(--pen);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice b{font-weight:700}
.periodbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.periodbar label{font-weight:700;font-size:12.5px;color:var(--muted)}
select,input[type=text],input[type=search],input[type=date],input[type=url]{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0;width:100%}
.periodbar select,.periodbar input{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi h3{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.kpi .big{font-size:28px;font-weight:800;line-height:1.1}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
.up{color:var(--pos);font-weight:700}.down{color:var(--neg);font-weight:700}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);margin:8px 0 6px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}
.layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
aside.filters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
@media(max-width:860px){aside.filters{position:static}}
aside h2{margin:0;font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.check{display:flex;gap:8px;align-items:center;font-size:12.5px}
.check input{width:auto}
.count{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.item.off{opacity:.55}
.row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:700;background:var(--accent-bg);color:var(--accent-ink)}
.chip.veic{background:var(--neu-bg);color:var(--fg)}
.badge{border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:800}
.t-Positivo{background:var(--pos-bg);color:var(--pos)}.t-Neutro{background:var(--neu-bg);color:var(--neu)}.t-Negativo{background:var(--neg-bg);color:var(--neg)}.t-Pendente{background:var(--pen-bg);color:var(--pen)}
.item h3{margin:8px 0 6px;font-size:15px;font-weight:700;line-height:1.35}
.item h3 a{color:inherit;text-decoration:none}
.item h3 a:hover{color:var(--accent-ink);text-decoration:underline}
.meta{font-size:12px;color:var(--muted)}
.tomctl{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tomctl button{border:0;background:var(--surface);padding:6px 11px;font:700 12px var(--font);cursor:pointer;border-right:1px solid var(--line)}
.tomctl button:last-child{border-right:0}
.tomctl button.on.Positivo{background:var(--pos-bg);color:var(--pos)}.tomctl button.on.Neutro{background:var(--neu-bg);color:var(--neu)}.tomctl button.on.Negativo{background:var(--neg-bg);color:var(--neg)}
.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.sp{flex:1}
.det{display:none;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.det.open{display:grid}
.det label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:3px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
dialog{border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 28px);background:var(--surface);color:var(--fg);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,20,15,.55)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dh h3{margin:0;font-size:16px}
.db{padding:16px 20px;display:grid;gap:12px;max-height:70vh;overflow:auto}
.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.db label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
/* relatório */
.rep section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.rep h2{margin:0 0 4px;font-size:16px;font-weight:800}
.rep h2 + p{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.rep .twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.rep .twocol{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:12.5px}
@media(max-width:560px){.bar{grid-template-columns:100px 1fr 54px}}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:14px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}
.bar .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.repbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.repbig div{background:var(--bg);border-radius:12px;padding:12px 14px}
.repbig b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.repbig span{font-size:12px;color:var(--muted)}
.negitem{padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.negitem:first-of-type{border-top:0}
.printonly{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.panel h3{margin:0 0 2px;font-size:14px;font-weight:800}
.panel .meta{margin-bottom:10px}
.evo{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.evo .col{flex:1;min-width:18px;display:flex;flex-direction:column;align-items:stretch}
.evo .bars{height:110px;display:flex;flex-direction:column-reverse}
.evo .bars i{display:block;width:100%}
.evo .l{font-size:10px;color:var(--muted);text-align:center;margin-top:4px;white-space:nowrap}
footer.pg{margin-top:28px;text-align:center;color:var(--muted);font-size:12.5px}
@media print{
  body{background:#fff;color:#000}
  header.top,.periodbar .noprint,.noprint,.notice,footer.pg,.tabs{display:none!important}
  .printonly{display:block}
  .rep section{break-inside:avoid;box-shadow:none}
  main{padding:0}
}
</style>
</head>

        <button class="btn primary" id="btnBol" type="button"><span>Boletim (<span id="bolN">0</span>)</span></button>
      </div>
    </div>

<main class="wrap">

<dialog id="dlgNew">
  <div class="dh"><h3>Cadastrar matéria</h3><button class="btn small" data-close type="button">Fechar</button></div>
  <form id="formNew" method="dialog">
    <div class="db">
      <div><label for="nTitulo">Título *</label><input type="text" id="nTitulo" required></div>
      <div class="grid2">
        <div><label for="nVeic">Veículo *</label><input type="text" id="nVeic" required list="listVeic"></div>

<script>
(function(){
'use strict';
var TONS=['Positivo','Neutro','Negativo'];
var ASSUNTOS=['Ensino','Pesquisa','Extensão','Assistência estudantil','Gestão','Eventos','Institucional','Outros'];
var ALCANCES=['Local','Regional','Estadual','Nacional'];
var ORIGENS=['Pauta da ASCOM','Espontânea'];
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
// Alcance inicial de veículos conhecidos. Ajuste pelo painel ou em dados/veiculos.json ({"Nome do veículo":"Alcance"}).
var VEIC_PADRAO={'Correio de Carajás':'Local','Portal Debate':'Local','O Liberal':'Estadual','Diário do Pará':'Estadual','diariodopara.com.br':'Estadual','DOL':'Estadual','G1':'Nacional','Agência Brasil':'Nacional','UOL Notícias':'Nacional','Valor Econômico':'Nacional'};
var LS='clipping-ascom-revisoes-v1';
var $=function(id){return document.getElementById(id);};

var base=[], repoRev={over:{},manuais:[],veiculos:{}}, repoVeic={}, local=loadLocal();
var selBol=[], editing={};

function loadLocal(){ try{ var r=JSON.parse(localStorage.getItem(LS)); if(r&&r.over) return r; }catch(e){} return {over:{},manuais:[],veiculos:{}}; }
function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify(local)); }catch(e){} avisar(); }

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeUrl(u){ return /^https?:\/\//i.test(u||'')?u:''; }
function hash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return 'a'+(h>>>0).toString(36);}
function fmt(d){return d?d.split('-').reverse().join('/'):'s/d';}
function parseData(t){ var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((t||'').trim()); if(!m) return ''; var d=+m[1],mo=+m[2],y=+m[3]; if(mo<1||mo>12||d<1||d>lastDay(y,mo)) return ''; return y+'-'+pad(mo)+'-'+pad(d); }
function mascara(el){ el.addEventListener('input',function(){ var v=el.value.replace(/\D/g,'').slice(0,8); if(v.length>4) v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4); else if(v.length>2) v=v.slice(0,2)+'/'+v.slice(2); el.value=v; }); }
function hojeBR(){ return fmt(new Date().toISOString().slice(0,10)); }
function nomeMes(m){var p=m.split('-');return MESES[+p[1]-1]+' de '+p[0];}
function pct(n,t){return t?Math.round(n/t*1000)/10:0;}
function pct1(n,t){return (pct(n,t)+'').replace('.',',')+'%';}
function pad(n){return (n<10?'0':'')+n;}
function lastDay(y,m){return new Date(y,m,0).getDate();}

/* ---------- dados ---------- */
function veicAlcance(v){ return local.veiculos[v]||repoRev.veiculos[v]||repoVeic[v]||VEIC_PADRAO[v]||''; }
function todas(){
  var manuais=(repoRev.manuais||[]).concat(local.manuais||[]);
  var arr=base.map(function(r){return Object.assign({},r,{id:hash((r.titulo||'')+'|'+(r.veiculo||'')),manual:false});}).concat(manuais.map(function(r){return Object.assign({},r,{manual:true,termos:r.termos||['Cadastro manual']});}));
  return arr.map(function(r){
    var o=Object.assign({},repoRev.over[r.id],local.over[r.id]);
    var it=Object.assign({},r,o);
    it.tom=TONS.indexOf(it.tom)>=0?it.tom:'Pendente';
    it.alcance=it.alcance||veicAlcance(it.veiculo);
    return it;
  });
}
function setOver(id,campos){
  var manual=(local.manuais||[]).filter(function(m){return m.id===id;})[0];
  if(manual){ Object.assign(manual,campos); }
  else { local.over[id]=Object.assign({},local.over[id],campos); }
  saveLocal();
}
function avisar(){
  var n=Object.keys(local.over).length+(local.manuais||[]).length+Object.keys(local.veiculos||{}).length;
  $('notice').style.display=n?'flex':'none';
  $('noticeTxt').innerHTML='<b>'+n+' alteraç'+(n===1?'ão':'ões')+'</b> só neste navegador. Para valer para toda a equipe, baixe as revisões e envie o arquivo à pasta <b>dados</b> do repositório.';
}

/* ---------- período ---------- */
var periodoKey='';
function montarPeriodos(){
  var its=todas(), meses={}, anos={};
  its.forEach(function(r){ if(r.data){meses[r.data.slice(0,7)]=1;anos[r.data.slice(0,4)]=1;} });
  var ms=Object.keys(meses).sort().reverse(), as=Object.keys(anos).sort().reverse();
  var h='<option value="all">Todo o período</option>';
  if(as.length) h+='<optgroup label="Ano">'+as.map(function(a){return '<option value="y:'+a+'">'+a+'</option>';}).join('')+'</optgroup>';
  if(ms.length) h+='<optgroup label="Mês">'+ms.map(function(m){return '<option value="m:'+m+'">'+nomeMes(m)+'</option>';}).join('')+'</optgroup>';
  if(ms.length) h+='<optgroup label="Quinzena">'+ms.map(function(m){return '<option value="q:'+m+':2">2ª quinzena de '+nomeMes(m)+'</option><option value="q:'+m+':1">1ª quinzena de '+nomeMes(m)+'</option>';}).join('')+'</optgroup>';
  h+='<option value="c">Personalizado</option>';
  $('periodo').innerHTML=h;
  if(!periodoKey||!$('periodo').querySelector('option[value="'+periodoKey+'"]')) periodoKey=ms.length?'m:'+ms[0]:'all';
  $('periodo').value=periodoKey;
}
function faixa(key){
  var p=key.split(':');
  if(key==='all') return {ini:'0000-00-00',fim:'9999-99-99',prev:null,nome:'Todo o período'};
  if(key==='c'){ var i=parseData($('cIni').value)||'0000-00-00', f=parseData($('cFim').value)||'9999-99-99'; return {ini:i,fim:f,prev:null,nome:'De '+fmt(i)+' a '+fmt(f)}; }
  if(p[0]==='y'){ var y=+p[1]; return {ini:y+'-01-01',fim:y+'-12-31',prev:{ini:(y-1)+'-01-01',fim:(y-1)+'-12-31'},nome:'Ano de '+y}; }
  if(p[0]==='m'){ var a=p[1].split('-'),Y=+a[0],M=+a[1]; var pm=M===1?[Y-1,12]:[Y,M-1];
    return {ini:p[1]+'-01',fim:p[1]+'-'+lastDay(Y,M),prev:{ini:pm[0]+'-'+pad(pm[1])+'-01',fim:pm[0]+'-'+pad(pm[1])+'-'+lastDay(pm[0],pm[1])},nome:nomeMes(p[1])}; }
  if(p[0]==='q'){ var b=p[1].split('-'),YY=+b[0],MM=+b[1],q=+p[2], ld=lastDay(YY,MM);
    var cur=q===1?{ini:p[1]+'-01',fim:p[1]+'-15'}:{ini:p[1]+'-16',fim:p[1]+'-'+ld}, prev;
    if(q===2) prev={ini:p[1]+'-01',fim:p[1]+'-15'}; else { var pm2=MM===1?[YY-1,12]:[YY,MM-1]; prev={ini:pm2[0]+'-'+pad(pm2[1])+'-16',fim:pm2[0]+'-'+pad(pm2[1])+'-'+lastDay(pm2[0],pm2[1])}; }
    return {ini:cur.ini,fim:cur.fim,prev:prev,nome:q+'ª quinzena de '+nomeMes(p[1])}; }
  return {ini:'0000-00-00',fim:'9999-99-99',prev:null,nome:''};
}
function noPeriodo(its,f){ return its.filter(function(r){return r.data>=f.ini&&r.data<=f.fim;}); }
function ativas(its){ return its.filter(function(r){return !r.descartada;}); }

/* ---------- contagens ---------- */
function contar(its,campo,lista){ var o={}; its.forEach(function(r){var k=r[campo]||'(não informado)'; o[k]=(o[k]||0)+1;}); return o; }
function ordenar(o){ return Object.keys(o).map(function(k){return [k,o[k]];}).sort(function(a,b){return b[1]-a[1]||a[0].localeCompare(b[0],'pt');}); }
function porTom(its){ var o={Positivo:0,Neutro:0,Negativo:0,Pendente:0}; its.forEach(function(r){o[r.tom]++;}); return o; }
var COR={Positivo:'var(--pos)',Neutro:'var(--neu)',Negativo:'var(--neg)',Pendente:'var(--line)'};
function stackHtml(o,total){
  var h='<div class="stack">'+['Positivo','Neutro','Negativo','Pendente'].map(function(t){return o[t]?'<i style="width:'+pct(o[t],total)+'%;background:'+COR[t]+'" title="'+t+'"></i>':'';}).join('')+'</div>';
  h+='<div class="legend">'+['Positivo','Neutro','Negativo','Pendente'].filter(function(t){return o[t];}).map(function(t){return '<span style="--c:'+COR[t]+'">'+(t==='Pendente'?'A classificar':t+'s')+' '+o[t]+'</span>';}).join('')+'</div>';
  return h;
}

/* ---------- filtros ---------- */
function opts(sel,lista,todos){ $(sel).innerHTML='<option value="">'+todos+'</option>'+lista.map(function(x){return '<option value="'+esc(x[0]||x)+'">'+esc(x[1]||x)+'</option>';}).join(''); }
function montarFiltros(){
  var its=todas(), cur={tom:$('fTom').value,as:$('fAssunto').value,al:$('fAlcance').value,ve:$('fVeic').value,or:$('fOrigem').value};
  opts('fTom',[['Positivo','Positivo'],['Neutro','Neutro'],['Negativo','Negativo'],['Pendente','A classificar']],'Todos os tons');
  opts('fAssunto',ASSUNTOS.concat(['(sem assunto)']).map(function(a){return [a=='(sem assunto)'?'-':a,a];}),'Todos os assuntos');
  opts('fAlcance',ALCANCES.concat(['(sem alcance)']).map(function(a){return [a=='(sem alcance)'?'-':a,a];}),'Todos os alcances');
  var v={}; its.forEach(function(r){if(r.veiculo)v[r.veiculo]=1;});
  opts('fVeic',Object.keys(v).sort(function(a,b){return a.localeCompare(b,'pt');}).map(function(x){return [x,x];}),'Todos os veículos');
  opts('fOrigem',ORIGENS.concat(['(não informada)']).map(function(a){return [a=='(não informada)'?'-':a,a];}),'Todas as origens');
  $('fTom').value=cur.tom;$('fAssunto').value=cur.as;$('fAlcance').value=cur.al;$('fVeic').value=cur.ve;$('fOrigem').value=cur.or;
  var sel=function(id,lista,vazio){$(id).innerHTML='<option value="">'+vazio+'</option>'+lista.map(function(a){return '<option>'+a+'</option>';}).join('');};
  sel('nTom',TONS,'A classificar');sel('nAssunto',ASSUNTOS,'Não informado');sel('nAlcance',ALCANCES,'Não informado');sel('nOrigem',ORIGENS,'Não informada');
  $('listVeic').innerHTML=Object.keys(v).map(function(x){return '<option value="'+esc(x)+'">';}).join('');
}
function filtrar(){
  var f=faixa(periodoKey), q=$('q').value.trim().toLowerCase();
  var tom=$('fTom').value,as=$('fAssunto').value,al=$('fAlcance').value,ve=$('fVeic').value,or=$('fOrigem').value,desc=$('fDesc').checked;
  return noPeriodo(todas(),f).filter(function(r){
    if(r.descartada&&!desc) return false;
    if(q&&((r.titulo||'')+' '+(r.veiculo||'')).toLowerCase().indexOf(q)<0) return false;
    if(tom&&r.tom!==tom) return false;
    if(as&&(as==='-'?r.assunto:r.assunto!==as)) return false;
    if(al&&(al==='-'?r.alcance:r.alcance!==al)) return false;
    if(ve&&r.veiculo!==ve) return false;
    if(or&&(or==='-'?r.origem:r.origem!==or)) return false;
    return true;
  }).sort(function(a,b){return a.data<b.data?1:a.data>b.data?-1:0;});
}

/* ---------- painel ---------- */
function kpis(){
  var f=faixa(periodoKey), all=todas(), cur=ativas(noPeriodo(all,f)), t=cur.length, tons=porTom(cur);
  var classif=tons.Positivo+tons.Neutro+tons.Negativo, prevHtml='';
  if(f.prev){ var pn=ativas(noPeriodo(all,f.prev)).length; prevHtml=pn?(function(){var d=Math.round((t-pn)/pn*100);return '<span class="'+(d>=0?'up':'down')+'">'+(d>=0?'▲ +':'▼ ')+d+'%</span> em relação ao período anterior ('+pn+')';})():'Sem dados do período anterior'; }
  var vc=ordenar(contar(cur,'veiculo')).slice(0,3), al=contar(cur,'alcance');
  var h='<div class="kpi"><h3>Matérias no período</h3><div class="big">'+t+'</div><div class="sub">'+esc(f.nome)+(prevHtml?'<br>'+prevHtml:'')+'</div></div>';
  h+='<div class="kpi"><h3>Tom da cobertura</h3>'+(t?stackHtml(tons,t):'<div class="sub">Sem matérias</div>')+(classif?'<div class="sub">'+pct1(tons.Positivo,classif)+' positivas, '+pct1(tons.Neutro,classif)+' neutras e '+pct1(tons.Negativo,classif)+' negativas entre as '+classif+' classificadas</div>':'')+'</div>';
  h+='<div class="kpi"><h3>Alcance</h3>'+(t?ALCANCES.concat(['(não informado)']).filter(function(a){return al[a];}).map(function(a){return '<div class="meta" style="display:flex;justify-content:space-between"><span>'+a+'</span><b>'+al[a]+'</b></div>';}).join(''):'<div class="sub">Sem matérias</div>')+'</div>';
  h+='<div class="kpi"><h3>Veículos que mais citam</h3>'+(vc.length?vc.map(function(x){return '<div class="meta" style="display:flex;justify-content:space-between;gap:8px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x[0])+'</span><b>'+x[1]+'</b></div>';}).join(''):'<div class="sub">Sem matérias</div>')+'</div>';
  $('kpis').innerHTML=h;
}
function selOpts(lista,atual,vazio){ return '<option value="">'+vazio+'</option>'+lista.map(function(a){return '<option'+(a===atual?' selected':'')+'>'+a+'</option>';}).join(''); }
function lista(){
  var its=filtrar(); $('contagem').textContent=its.length+(its.length===1?' matéria':' matérias');
  if(!its.length){ $('lista').innerHTML='<div class="empty">Nenhuma matéria encontrada neste período com esses filtros.</div>'; return; }
  $('lista').innerHTML=its.map(function(r){
    var link=safeUrl(r.link), tit=link?'<a href="'+esc(link)+'" target="_blank" rel="noopener">'+esc(r.titulo)+'</a>':esc(r.titulo), on=selBol.indexOf(r.id)>=0, open=editing[r.id];
    var chips=(r.assunto?'<span class="chip">'+esc(r.assunto)+'</span>':'')+(r.origem?'<span class="chip">'+esc(r.origem)+'</span>':'');
    return '<article class="item'+(on?' sel':'')+(r.descartada?' off':'')+'" data-id="'+r.id+'">'+
      '<div class="row1"><span class="chip veic">'+esc(r.veiculo||'Veículo não informado')+'</span><span>'+fmt(r.data)+'</span>'+(r.alcance?'<span>· '+esc(r.alcance)+'</span>':'<span>· alcance não definido</span>')+
      '<span class="sp"></span><span class="badge t-'+r.tom+'">'+(r.tom==='Pendente'?'A classificar':r.tom)+(r.revisado?' ✓':'')+'</span></div>'+
      '<h3>'+tit+'</h3>'+
      '<div class="meta">'+(r.manual?'Cadastro manual':'Encontrada por: '+esc((r.termos||[]).join(', ')))+(r.descartada?' · <b>descartada</b>':'')+'</div>'+
      (chips?'<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">'+chips+'</div>':'')+
      '<div class="foot"><span class="tomctl" role="group" aria-label="Classificar tom">'+TONS.map(function(t){return '<button type="button" data-act="tom" data-v="'+t+'" class="'+t+(r.tom===t?' on':'')+'">'+t+'</button>';}).join('')+'</span>'+
      '<button class="btn small" type="button" data-act="det">'+(open?'Fechar detalhes':'Detalhes')+'</button><span class="sp"></span>'+
      '<button class="btn small" type="button" data-act="bol">'+(on?'✓ No boletim':'+ Boletim')+'</button>'+
      '<button class="btn small" type="button" data-act="desc">'+(r.descartada?'Restaurar':'Descartar')+'</button></div>'+
      '<div class="det'+(open?' open':'')+'"><div><label>Assunto</label><select data-f="assunto">'+selOpts(ASSUNTOS,r.assunto,'Não informado')+'</select></div>'+
      '<div><label>Alcance</label><select data-f="alcance">'+selOpts(ALCANCES,r.alcance,'Não definido')+'</select></div>'+
      '<div><label>Origem</label><select data-f="origem">'+selOpts(ORIGENS,r.origem,'Não informada')+'</select></div></div>'+
    '</article>';
  }).join('');
}
$('lista').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return; var card=b.closest('.item'), id=card.getAttribute('data-id'), act=b.getAttribute('data-act');
  var it=todas().filter(function(r){return r.id===id;})[0]; if(!it) return;
  if(act==='tom'){ var v=b.getAttribute('data-v'); if(it.tom===v) setOver(id,{tom:'',revisado:false}); else setOver(id,{tom:v,revisado:true}); }
  else if(act==='det'){ editing[id]=!editing[id]; }
  else if(act==='bol'){ var i=selBol.indexOf(id); if(i>=0) selBol.splice(i,1); else selBol.push(id); $('bolN').textContent=selBol.length; }
  else if(act==='desc'){ setOver(id,{descartada:!it.descartada}); }
  atualizar();
});
$('lista').addEventListener('change',function(e){
  var s=e.target.closest('[data-f]'); if(!s) return; var card=s.closest('.item'), id=card.getAttribute('data-id'), campo=s.getAttribute('data-f'), v=s.value;
  var it=todas().filter(function(r){return r.id===id;})[0]; if(!it) return;
  if(campo==='alcance'&&it.veiculo&&v&&confirm('Aplicar o alcance "'+v+'" a todas as matérias de '+it.veiculo+'?')){ local.veiculos[it.veiculo]=v; saveLocal(); }
  else { var o={}; o[campo]=v; setOver(id,o); }
  atualizar();
});

/* ---------- relatório ---------- */
function barras(pares,total,cor){ return pares.map(function(p){return '<div class="bar"><span class="lab" title="'+esc(p[0])+'">'+esc(p[0])+'</span><span class="tr"><i style="width:'+pct(p[1],total)+'%;background:'+(cor||'var(--accent)')+'"></i></span><span class="val">'+p[1]+' · '+pct1(p[1],total)+'</span></div>';}).join('')||'<div class="meta">Sem dados.</div>'; }
function evolucao(its){
  if(!its.length) return {html:'<div class="meta">Sem matérias neste período.</div>',modo:''};
  var ds=its.map(function(r){return r.data;}).filter(Boolean).sort(), min=ds[0], max=ds[ds.length-1];
  var d0=new Date(min+'T00:00:00'), d1=new Date(max+'T00:00:00'), span=Math.round((d1-d0)/864e5);
  var modo=span<=35?'dia':span<=150?'semana':'mes', keys=[], rot={};
  function dia(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
  if(modo==='dia'){ for(var i=0;i<=span;i++){var dt=new Date(d0.getTime()+i*864e5),k=dia(dt);keys.push(k);rot[k]=pad(dt.getDate())+'/'+pad(dt.getMonth()+1);} }
  else if(modo==='semana'){ for(var w=0;w<=Math.floor(span/7);w++){var dt2=new Date(d0.getTime()+w*7*864e5);keys.push(String(w));rot[w]=pad(dt2.getDate())+'/'+pad(dt2.getMonth()+1);} }
  else { var y=d0.getFullYear(),m=d0.getMonth(); while(y<d1.getFullYear()||(y===d1.getFullYear()&&m<=d1.getMonth())){var k2=y+'-'+pad(m+1);keys.push(k2);rot[k2]=MESES[m].slice(0,3)+'/'+String(y).slice(2);m++;if(m>11){m=0;y++;}} }
  var bk={}; keys.forEach(function(k){bk[k]={Positivo:0,Neutro:0,Negativo:0,Pendente:0,n:0};});
  its.forEach(function(r){ if(!r.data) return; var k=modo==='dia'?r.data:modo==='mes'?r.data.slice(0,7):String(Math.floor(Math.round((new Date(r.data+'T00:00:00')-d0)/864e5)/7)); if(bk[k]){bk[k][r.tom]++;bk[k].n++;} });
  var mx=Math.max.apply(null,keys.map(function(k){return bk[k].n;}))||1, step=Math.ceil(keys.length/12);
  var h='<div class="evo">'+keys.map(function(k,i){var o=bk[k];return '<div class="col" title="'+rot[k]+(modo==='semana'?' (semana)':'')+': '+o.n+' matéria'+(o.n===1?'':'s')+'"><div class="bars">'+['Positivo','Neutro','Negativo','Pendente'].map(function(t){return o[t]?'<i style="height:'+(o[t]/mx*110)+'px;background:'+COR[t]+'"></i>':'';}).join('')+'</div><div class="l">'+(i%step===0?rot[k]:'&nbsp;')+'</div></div>';}).join('')+'</div>';
  return {html:h,modo:modo,max:mx};
}
function painelEvo(){
  var f=faixa(periodoKey), its=ativas(noPeriodo(todas(),f)), ev=evolucao(its);
  var tit={dia:'por dia',semana:'por semana',mes:'por mês','':''}[ev.modo];
  $('evoPanel').innerHTML='<h3>Evolução das matérias '+tit+'</h3><div class="meta">'+(ev.max?'Maior movimento: '+ev.max+' matéria'+(ev.max===1?'':'s')+' em um '+({dia:'dia',semana:'período de 7 dias',mes:'mês'}[ev.modo])+'. ':'')+'Cores: verde positivas, cinza neutras, vermelho negativas, claro a classificar.</div>'+ev.html;
}
function relatorio(){
  var f=faixa(periodoKey), all=todas(), pend=noPeriodo(all,f).filter(function(r){return r.descartada;}).length, its=ativas(noPeriodo(all,f)), t=its.length, tons=porTom(its), cl=tons.Positivo+tons.Neutro+tons.Negativo;
  var h='<section><h2>Relatório de imprensa</h2><p>'+esc(f.nome)+'. Gerado em '+fmt(new Date().toISOString().slice(0,10))+'.</p>';
  h+='<div class="noprint" style="margin-bottom:12px"><button class="btn primary" id="btnPrint" type="button">Imprimir ou salvar em PDF</button> <button class="btn" id="btnCsv2" type="button">Baixar planilha (.csv)</button></div>';
  if(tons.Pendente) h+='<div class="notice" style="display:flex"><span><b>'+tons.Pendente+' matéria'+(tons.Pendente>1?'s':'')+' ainda sem classificação.</b> Os percentuais abaixo consideram apenas as '+cl+' classificadas.</span></div>';
  h+='<div class="repbig"><div><b>'+t+'</b><span>inserções na mídia</span></div><div><b style="color:var(--pos)">'+tons.Positivo+'</b><span>positivas ('+pct1(tons.Positivo,cl)+')</span></div><div><b style="color:var(--neu)">'+tons.Neutro+'</b><span>neutras ('+pct1(tons.Neutro,cl)+')</span></div><div><b style="color:var(--neg)">'+tons.Negativo+'</b><span>negativas ('+pct1(tons.Negativo,cl)+')</span></div></div>';
  if(f.prev){ var pn=ativas(noPeriodo(all,f.prev)).length; h+='<p style="margin:12px 0 0;font-size:13px">'+(pn?'Período anterior: <b>'+pn+'</b> inserções ('+(t>=pn?'+':'')+Math.round((t-pn)/pn*100)+'%).':'Não há dados do período anterior nesta base.')+'</p>'; }
  h+='<p style="margin:10px 0 0;font-size:12.5px;color:var(--muted)">Índice de publicação positiva: positivas sobre o total de matérias classificadas ('+pct1(tons.Positivo,cl)+'). As neutras são apresentadas separadamente.</p></section>';

  var ev=evolucao(its); h+='<section><h2>Evolução '+({dia:'por dia',semana:'por semana',mes:'por mês','':''}[ev.modo])+'</h2><p>Inserções ao longo do período, divididas por tom (verde positivas, cinza neutras, vermelho negativas, claro a classificar).</p>'+ev.html+'</section>';
  h+='<div class="twocol"><section><h2>Alcance</h2><p>Onde a universidade foi citada.</p>'+barras(ordenar(contar(its,'alcance')),t)+'</section><section><h2>Assuntos</h2><p>Temas das matérias.</p>'+barras(ordenar(contar(its,'assunto')),t)+'</section></div>';
  h+='<div class="twocol"><section><h2>Veículos que mais citam</h2><p>Dez primeiros.</p>'+barras(ordenar(contar(its,'veiculo')).slice(0,10),t)+'</section><section><h2>Origem da pauta</h2><p>Divulgação da ASCOM e matérias espontâneas.</p>'+barras(ordenar(contar(its,'origem')),t)+'</section></div>';
  var neg=its.filter(function(r){return r.tom==='Negativo';}).sort(function(a,b){return a.data<b.data?1:-1;});
  h+='<section><h2>Matérias negativas ('+neg.length+')</h2><p>Para análise e registro do contexto.</p>'+(neg.length?neg.map(function(r){var l=safeUrl(r.link);return '<div class="negitem"><b>'+esc(r.veiculo)+'</b> · '+fmt(r.data)+'<br>'+(l?'<a href="'+esc(l)+'" target="_blank" rel="noopener">'+esc(r.titulo)+'</a>':esc(r.titulo))+'</div>';}).join(''):'<div class="meta">Nenhuma matéria negativa classificada neste período.</div>')+'</section>';
  if(pend) h+='<p class="meta noprint">'+pend+' matéria(s) descartada(s) neste período não entram nos números.</p>';
  $('viewRelatorio').innerHTML=h;
  $('btnPrint').onclick=function(){window.print();}; $('btnCsv2').onclick=function(){csv(its);};
}

/* ---------- exportações ---------- */
function baixar(nome,conteudo,tipo){ var b=new Blob([conteudo],{type:tipo}), a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500); }
function csv(its){
  var l=[['Data','Veículo','Título','Tom','Assunto','Alcance','Origem','Link']].concat(its.map(function(r){return [fmt(r.data),r.veiculo,r.titulo,r.tom==='Pendente'?'A classificar':r.tom,r.assunto||'',r.alcance||'',r.origem||'',r.link||''];}));
  baixar('clipping-ascom.csv','﻿'+l.map(function(x){return x.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n'),'text/csv;charset=utf-8');
}
$('btnCsv').onclick=function(){csv(filtrar());};
$('btnExport').onclick=function(){
  var out={over:Object.assign({},repoRev.over),manuais:(repoRev.manuais||[]).slice(),veiculos:Object.assign({},repoRev.veiculos)};
  Object.keys(local.over).forEach(function(k){out.over[k]=Object.assign({},out.over[k],local.over[k]);});
  (local.manuais||[]).forEach(function(m){out.manuais=out.manuais.filter(function(x){return x.id!==m.id;}); out.manuais.push(m);});
  Object.assign(out.veiculos,local.veiculos);
  baixar('revisoes.json',JSON.stringify(out,null,1),'application/json');
};
$('btnClearLocal').onclick=function(){ if(confirm('Descartar as alterações feitas só neste navegador? Faça isso depois de enviar o arquivo revisoes.json ao repositório, ou se quiser desfazer.')){ local={over:{},manuais:[],veiculos:{}}; saveLocal(); atualizar(); } };

/* ---------- boletim ---------- */
function bolItens(){ var m={}; todas().forEach(function(r){m[r.id]=r;}); return selBol.map(function(i){return m[i];}).filter(Boolean); }
function abrirBol(){
  var its=bolItens(), b=$('bolBody');
  b.innerHTML=its.length?'<p class="meta" style="margin:0">'+its.length+' matéria(s) selecionada(s). Elas seguem para o e-mail na ordem abaixo.</p>'+its.map(function(r,i){return '<div class="negitem"><b>['+(i+1)+'] '+esc(r.veiculo)+'</b> · '+fmt(r.data)+'<br>'+esc(r.titulo)+' <button class="btn small" data-rm="'+r.id+'" type="button">Remover</button></div>';}).join(''):'<div class="empty">Nenhuma matéria selecionada. Use o botão "+ Boletim" nas matérias.</div>';
  $('dlgBol').showModal();
}
$('btnBol').onclick=abrirBol;
$('bolBody').addEventListener('click',function(e){ var r=e.target.closest('[data-rm]'); if(!r) return; selBol=selBol.filter(function(i){return i!==r.getAttribute('data-rm');}); $('bolN').textContent=selBol.length; abrirBolRefresh(); atualizar(); });
function abrirBolRefresh(){ var d=$('dlgBol'); var o=d.open; if(!o) return; var its=bolItens(); $('bolBody').innerHTML=its.length?'<p class="meta" style="margin:0">'+its.length+' matéria(s) selecionada(s).</p>'+its.map(function(r,i){return '<div class="negitem"><b>['+(i+1)+'] '+esc(r.veiculo)+'</b> · '+fmt(r.data)+'<br>'+esc(r.titulo)+' <button class="btn small" data-rm="'+r.id+'" type="button">Remover</button></div>';}).join(''):'<div class="empty">Nenhuma matéria selecionada.</div>'; }
$('bolLimpar').onclick=function(){selBol=[];$('bolN').textContent=0;abrirBolRefresh();atualizar();};
$('bolCopiar').onclick=function(){
  var its=bolItens(); if(!its.length) return; var f=faixa(periodoKey);
  var html='<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222"><p style="margin:0 0 4px"><b>UNIVERSIDADE FEDERAL DO SUL E SUDESTE DO PARÁ</b></p><p style="margin:0 0 14px;color:#555">Assessoria de Comunicação · Clipping: '+esc(f.nome)+'</p>'+its.map(function(r,i){var l=safeUrl(r.link);return '<p style="margin:0 0 12px"><b>['+(i+1)+'] '+esc(r.veiculo)+'</b>, '+fmt(r.data)+'<br>'+(l?'<a href="'+esc(l)+'">'+esc(r.titulo)+'</a>':esc(r.titulo))+'</p>';}).join('')+'</div>';
  var txt='UNIVERSIDADE FEDERAL DO SUL E SUDESTE DO PARÁ\nAssessoria de Comunicação · Clipping: '+f.nome+'\n\n'+its.map(function(r,i){return '['+(i+1)+'] '+r.veiculo+', '+fmt(r.data)+'\n'+r.titulo+'\n'+(r.link||'');}).join('\n\n');
  var ok=function(){ $('bolCopiar').textContent='Copiado'; setTimeout(function(){$('bolCopiar').textContent='Copiar para e-mail';},1600); };
  if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){ navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]).then(ok,function(){ navigator.clipboard.writeText(txt).then(ok); }); }
  else if(navigator.clipboard) navigator.clipboard.writeText(txt).then(ok);
};

/* ---------- cadastro manual ---------- */
$('btnNew').onclick=function(){ $('formNew').reset(); $('nData').value=hojeBR(); $('dlgNew').showModal(); };
$('formNew').addEventListener('submit',function(ev){
  if(!parseData($('nData').value)){ ev.preventDefault(); alert('Informe a data no formato dd/mm/aaaa.'); return; }
  var v=$('nVeic').value.trim(), id='m'+Date.now().toString(36);
  var m={id:id,titulo:$('nTitulo').value.trim(),veiculo:v,data:parseData($('nData').value),link:$('nLink').value.trim(),termos:['Cadastro manual'],tom:$('nTom').value,assunto:$('nAssunto').value,alcance:$('nAlcance').value,origem:$('nOrigem').value,revisado:!!$('nTom').value};
  local.manuais=local.manuais||[]; local.manuais.push(m); saveLocal();
  var d=m.data; if(d&&periodoKey!=='all'){ var f=faixa(periodoKey); if(d<f.ini||d>f.fim){ periodoKey='m:'+d.slice(0,7); } }
  setTimeout(function(){ montarPeriodos(); atualizar(); },0);
});
Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(b){b.addEventListener('click',function(){b.closest('dialog').close();});});

/* ---------- navegação ---------- */
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.addEventListener('click',function(){
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.setAttribute('aria-selected',x===t?'true':'false');});
  var rel=t.getAttribute('data-tab')==='relatorio'; $('viewPainel').style.display=rel?'none':''; $('viewRelatorio').style.display=rel?'':'none'; atualizar();
});});
$('periodo').addEventListener('change',function(){ periodoKey=$('periodo').value; $('custom').style.display=periodoKey==='c'?'inline-flex':'none'; atualizar(); });
['cIni','cFim'].forEach(function(id){mascara($(id));$(id).addEventListener('input',atualizar);});
mascara($('nData'));
['q','fTom','fAssunto','fAlcance','fVeic','fOrigem','fDesc'].forEach(function(id){$(id).addEventListener('input',function(){lista();});$(id).addEventListener('change',function(){lista();});});
$('limpar').onclick=function(){['q','fTom','fAssunto','fAlcance','fVeic','fOrigem'].forEach(function(id){$(id).value='';});$('fDesc').checked=false;lista();};

function atualizar(){ montarFiltros(); kpis(); painelEvo(); lista(); if($('viewRelatorio').style.display!=='none') relatorio(); avisar(); }

/* ---------- carga ---------- */
function get(url){ return fetch(url,{cache:'no-cache'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }); }
Promise.all([
  get('dados/clipping.json').catch(function(){return null;}),
  get('dados/revisoes.json').catch(function(){return null;}),
  get('dados/veiculos.json').catch(function(){return null;})
]).then(function(r){
  if(r[1]){ repoRev={over:r[1].over||{},manuais:r[1].manuais||[],veiculos:r[1].veiculos||{}}; }
  if(r[2]){ repoVeic=r[2]; }
  if(r[0]){ base=r[0]; }
  local.over=local.over||{}; local.manuais=local.manuais||[]; local.veiculos=local.veiculos||{};
  montarPeriodos(); atualizar();
  if(!r[0]&&!todas().length) $('lista').innerHTML='<div class="empty">Ainda não há dados. Rode a coleta (aba Actions do repositório) e recarregue a página.</div>';
});
window.__clip={todas:todas,faixa:faixa};
})();
